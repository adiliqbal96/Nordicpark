<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="2000"
   height="2000"
   viewBox="0 0 2000 2000"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">
  
  <!-- TILFØJET AF ANTIGRAVITY: Definitioner for tekst -->
  <defs>
    <style>
      text { font-family: 'Times New Roman', serif; letter-spacing:8px; }
    </style>
  </defs>

  <!-- BAGGRUNDSLAG (Skaber den sorte kant hele vejen rundt om formen!) -->
  <g stroke="#000000" fill="#000000" stroke-linejoin="round" stroke-linecap="round">
    <!-- Yderste ring skygge -->
    <path
       d="m 318.57836,1562.5426 a 914.69016,903.35804 0 1 1 1401.39674,0"
       stroke-width="100"
       fill="none" />
    <!-- Cirkel skygge -->
    <ellipse
       cx="1019.2767"
       cy="964.95135"
       rx="807.02368"
       ry="801.7663"
       stroke-width="45"
       fill="none" />
    <!-- Det hvide N skygge -->
    <text
       x="1191.453"
       y="810.0329"
       text-anchor="middle"
       dominant-baseline="central"
       transform="matrix(0.99396766,0.18429016,-0.20791087,0.96752048,0,0)"
       font-size="1282.33px"
       stroke-width="70">N</text>
    <!-- NORDIC PARK teksten skygge -->
    <text
       font-size="150px"
       transform="matrix(1.3962992,0,0,1.2560651,-386.21665,-54.290706)"
       stroke-width="30"><textPath
         href="#textcurve"
         startOffset="50%"
         text-anchor="middle">NORDIC PARK</textPath></text>
  </g>

  <!-- FORGRUNDSLAG (Det originale hvide logo - lægges nu rent og pænt oven på den sorte kasse!) -->
  <!-- Reference til den buede tekst (ses ikke) -->
  <path id="textcurve" d="m 500,1350 a 600,600 0 0 0 1000,0" fill="none" />
  
  <path
     d="m 318.57836,1562.5426 a 914.69016,903.35804 0 1 1 1401.39674,0"
     stroke="#ffffff"
     stroke-width="45.4504"
     stroke-linecap="round"
     fill="none" />
  
  <ellipse
     cx="1019.2767"
     cy="964.95135"
     stroke="#ffffff"
     stroke-width="10.584"
     fill="none"
     rx="807.02368"
     ry="801.7663" />

  <text
     x="1191.453"
     y="810.0329"
     text-anchor="middle"
     dominant-baseline="central"
     transform="matrix(0.99396766,0.18429016,-0.20791087,0.96752048,0,0)"
     font-size="1282.33px"
     fill="#ffffff"
     stroke="none">N</text>

  <text
     fill="#ffffff"
     font-size="150px"
     transform="matrix(1.3962992,0,0,1.2560651,-386.21665,-54.290706)"><textPath
       href="#textcurve"
       startOffset="50%"
       text-anchor="middle">NORDIC PARK</textPath></text>
</svg>
