<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #08101f;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0b1628 0%, #091220 50%, #0d1a30 100%);
    display: flex;
    align-items: center;
    padding: 0 90px;
    gap: 80px;
  }

  /* Background glow */
  .card::before {
    content: '';
    position: absolute;
    top: -120px;
    right: 80px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(30, 80, 180, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: 200px;
    width: 400px;
    height: 300px;
    background: radial-gradient(circle, rgba(250, 204, 21, 0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Gold top line */
  .top-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #FACC15 30%, #FACC15 70%, transparent);
    opacity: 0.9;
  }

  /* Logo */
  .logo-wrap {
    flex-shrink: 0;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap svg {
    width: 180px;
    height: 180px;
    filter: brightness(0) invert(1) drop-shadow(0 0 24px rgba(255,255,255,0.15));
  }

  /* Divider */
  .divider {
    width: 1px;
    height: 220px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
    flex-shrink: 0;
  }

  /* Text */
  .text-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .kicker {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FACC15;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .kicker::before {
    content: '';
    display: block;
    width: 28px;
    height: 2px;
    background: #FACC15;
  }

  h1 {
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  h1 span {
    color: #FACC15;
  }

  .subtitle {
    font-size: 22px;
    color: rgba(255,255,255,0.6);
    line-height: 1.4;
    max-width: 520px;
    font-weight: 400;
  }

  .tags {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 6px 16px;
  }

  .domain {
    position: absolute;
    bottom: 36px;
    right: 90px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-line"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <svg width="2000" height="2000" viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <style>.navy { fill:#ffffff; } text { font-family: 'Times New Roman', serif; letter-spacing:8px; }</style>
      </defs>
      <path d="m 318.57836,1562.5426 a 914.69016,903.35804 0 1 1 1401.39674,0" stroke="#ffffff" stroke-width="45.4504" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
      <ellipse cx="1019.2767" cy="964.95135" stroke="#ffffff" stroke-width="10.584" fill="none" rx="807.02368" ry="801.7663" stroke-opacity="0.7"/>
      <text x="1191.453" y="810.0329" text-anchor="middle" dominant-baseline="central" transform="matrix(0.99396766,0.18429016,-0.20791087,0.96752048,0,0)" class="navy" font-size="1282.33px">N</text>
      <path id="textcurve2" d="m 500,1350 a 600,600 0 0 0 1000,0" fill="none"/>
      <text fill="#ffffff" font-size="150px" transform="matrix(1.3962992,0,0,1.2560651,-386.21665,-54.290706)">
        <textPath href="#textcurve2" startOffset="50%" text-anchor="middle">NORDIC PARK</textPath>
      </text>
      <ellipse cx="1019.2767" cy="964.95135" stroke="#ffffff" stroke-width="10.584" fill="none" rx="807.02368" ry="801.7663" stroke-opacity="0.9"/>
    </svg>
  </div>

  <div class="divider"></div>

  <!-- Text -->
  <div class="text-block">
    <div class="kicker">Parkeringsselskab · Sjælland</div>
    <h1>Nordic Park <span>ApS</span></h1>
    <p class="subtitle">Professionel parkeringskontrol til boligforeninger, erhverv og private.</p>
    <div class="tags">
      <span class="tag">Fair kontrol</span>
      <span class="tag">Lokal service</span>
      <span class="tag">Dokumenteret</span>
      <span class="tag">Køge · Slagelse · Næstved</span>
    </div>
  </div>

  <div class="domain">nordicpark.eu</div>
</div>
</body>
</html>
